[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minipy-lang"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "antlr4-python3-runtime==4.13.2",
  "llvmlite",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]